[project]
name = "pyprolog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "janus-swi>=1.5.2",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["black>=26.5.1", "mypy>=2.1.0", "pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.pytest.ini_options]
addopts = "--cov=pyprolog --cov-report=html"
